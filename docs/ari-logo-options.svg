<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Ari logo directions</title>
  <desc id="desc">Four original logo concepts showing Ari as a friendly swarm of tiny helper bots.</desc>
  <defs>
    <g id="helper">
      <path d="M-13-22v-8m0 0c-4-5-1-9 3-9s7 4 3 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <rect x="-20" y="-24" width="40" height="48" rx="15" fill="currentColor"/>
      <rect x="-14" y="-10" width="28" height="16" rx="8" fill="#171922"/>
      <circle cx="-6" cy="-2" r="2.6" fill="#fff"/><circle cx="6" cy="-2" r="2.6" fill="#fff"/>
      <path d="M-10 24l-2 7m22-7 2 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="helper-round">
      <path d="M0-21v-8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-29" r="4" fill="currentColor"/>
      <path d="M-21 5c0-16 8-25 21-25S21-11 21 5c0 12-8 20-21 20S-21 17-21 5Z" fill="currentColor"/>
      <ellipse cx="0" cy="2" rx="13" ry="9" fill="#171922"/>
      <circle cx="-5" cy="2" r="2.2" fill="#fff"/><circle cx="5" cy="2" r="2.2" fill="#fff"/>
      <path d="M-10 24l-3 6m23-6 3 6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="helper-square">
      <path d="M0-22v-7m0 0-5-4m5 4 5-4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="currentColor"/>
      <rect x="-15" y="-9" width="30" height="16" rx="5" fill="#171922"/>
      <circle cx="-7" cy="-1" r="2.4" fill="#fff"/><circle cx="7" cy="-1" r="2.4" fill="#fff"/>
      <path d="M-11 22v7m22-7v7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="helper-tall">
      <path d="M5-26v-8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <circle cx="5" cy="-35" r="4" fill="currentColor"/>
      <path d="M-15 20v-26c0-13 6-21 17-21s17 8 17 21v26c0 8-7 13-17 13s-17-5-17-13Z" fill="currentColor"/>
      <rect x="-9" y="-8" width="22" height="14" rx="7" fill="#171922"/>
      <circle cx="-2" cy="-1" r="2" fill="#fff"/><circle cx="6" cy="-1" r="2" fill="#fff"/>
      <path d="M-8 32l-2 6m19-6 2 6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1600" height="1180" fill="#101116"/>
  <text x="76" y="92" fill="#f4f1ec" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="700" letter-spacing="-1.2">ARI — BRAND DIRECTIONS</text>
  <text x="78" y="133" fill="#a5a7b1" font-family="Inter, Arial, sans-serif" font-size="20">A whole crew of tiny helpers. Pick the personality that feels right.</text>

  <!-- Option 1: compact crowd -->
  <g transform="translate(70 178)">
    <rect width="700" height="430" rx="26" fill="#1a1c24" stroke="#343640" stroke-width="2"/>
    <text x="34" y="50" fill="#f4775d" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">01 · THE CREW</text>
    <text x="34" y="81" fill="#f3f1ed" font-family="Inter, Arial, sans-serif" font-size="19">A lively team mark, built from little characters.</text>
    <g transform="translate(350 221)">
      <g color="#8bd9c2" transform="translate(-106 -65) scale(.72)"><use href="#helper"/></g>
      <g color="#b7a5ff" transform="translate(-53 -68) scale(.77)"><use href="#helper-round"/></g>
      <g color="#ffbd67" transform="translate(0 -73) scale(.85)"><use href="#helper-square"/></g>
      <g color="#83b9ff" transform="translate(54 -67) scale(.77)"><use href="#helper-tall"/></g>
      <g color="#f4775d" transform="translate(107 -64) scale(.72)"><use href="#helper-round"/></g>
      <g color="#f4775d" transform="translate(-80 4) scale(.94)"><use href="#helper-square"/></g>
      <g color="#f2eee8" transform="translate(-26 0) scale(1.05)"><use href="#helper"/></g>
      <g color="#b7a5ff" transform="translate(31 0) scale(1.08)"><use href="#helper-round"/></g>
      <g color="#8bd9c2" transform="translate(86 6) scale(.91)"><use href="#helper-tall"/></g>
      <g color="#ffbd67" transform="translate(-54 71) scale(.73)"><use href="#helper-round"/></g>
      <g color="#83b9ff" transform="translate(0 73) scale(.79)"><use href="#helper-square"/></g>
      <g color="#f4775d" transform="translate(55 71) scale(.73)"><use href="#helper"/></g>
    </g>
    <text x="350" y="369" text-anchor="middle" fill="#f5f1ed" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-2">ari</text>
  </g>

  <!-- Option 2: lead character with orbiting crew -->
  <g transform="translate(830 178)">
    <rect width="700" height="430" rx="26" fill="#1a1c24" stroke="#343640" stroke-width="2"/>
    <text x="34" y="50" fill="#f4775d" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">02 · ARI &amp; THE OTHERS</text>
    <text x="34" y="81" fill="#f3f1ed" font-family="Inter, Arial, sans-serif" font-size="19">One recognizable captain, with a swarm behind.</text>
    <g transform="translate(350 222)">
      <g color="#8bd9c2" transform="translate(-133 -63) scale(.58)"><use href="#helper-round"/></g>
      <g color="#b7a5ff" transform="translate(126 -73) scale(.6)"><use href="#helper-square"/></g>
      <g color="#ffbd67" transform="translate(-137 63) scale(.58)"><use href="#helper-tall"/></g>
      <g color="#83b9ff" transform="translate(136 66) scale(.6)"><use href="#helper"/></g>
      <g color="#f2eee8" transform="translate(0 -94) scale(.48)"><use href="#helper"/></g>
      <g color="#f4775d" transform="scale(1.52)"><use href="#helper-round"/></g>
      <path d="M-110 0h20m180 0h20M0-104v-19M-106-66l-14-15m226 147 16 14" stroke="#676975" stroke-width="2" stroke-dasharray="4 7" fill="none"/>
    </g>
    <text x="350" y="369" text-anchor="middle" fill="#f5f1ed" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-2">ari</text>
  </g>

  <!-- Option 3: helpers build a letterform -->
  <g transform="translate(70 650)">
    <rect width="700" height="430" rx="26" fill="#1a1c24" stroke="#343640" stroke-width="2"/>
    <text x="34" y="50" fill="#f4775d" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">03 · THE SWARM GLYPH</text>
    <text x="34" y="81" fill="#f3f1ed" font-family="Inter, Arial, sans-serif" font-size="19">A bold, scalable “A” made out of mini agents.</text>
    <g transform="translate(350 224)">
      <g color="#f4775d" transform="translate(-78 -72) scale(.52)"><use href="#helper-round"/></g>
      <g color="#ffbd67" transform="translate(-39 -72) scale(.52)"><use href="#helper"/></g>
      <g color="#b7a5ff" transform="translate(0 -72) scale(.52)"><use href="#helper-square"/></g>
      <g color="#83b9ff" transform="translate(39 -72) scale(.52)"><use href="#helper-tall"/></g>
      <g color="#8bd9c2" transform="translate(78 -72) scale(.52)"><use href="#helper-round"/></g>
      <g color="#ffbd67" transform="translate(-58 -15) scale(.6)"><use href="#helper-square"/></g>
      <g color="#f4775d" transform="translate(-19 -15) scale(.6)"><use href="#helper-tall"/></g>
      <g color="#8bd9c2" transform="translate(20 -15) scale(.6)"><use href="#helper-round"/></g>
      <g color="#b7a5ff" transform="translate(59 -15) scale(.6)"><use href="#helper"/></g>
      <g color="#83b9ff" transform="translate(-72 48) scale(.54)"><use href="#helper-tall"/></g>
      <g color="#ffbd67" transform="translate(-24 48) scale(.54)"><use href="#helper-round"/></g>
      <g color="#f4775d" transform="translate(24 48) scale(.54)"><use href="#helper-square"/></g>
      <g color="#8bd9c2" transform="translate(72 48) scale(.54)"><use href="#helper"/></g>
      <path d="M-126 82h252" stroke="#f4775d" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="350" y="369" text-anchor="middle" fill="#f5f1ed" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-2">ari</text>
  </g>

  <!-- Option 4: parade of distinct little bot personalities -->
  <g transform="translate(830 650)">
    <rect width="700" height="430" rx="26" fill="#1a1c24" stroke="#343640" stroke-width="2"/>
    <text x="34" y="50" fill="#f4775d" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">04 · THE PARADE</text>
    <text x="34" y="81" fill="#f3f1ed" font-family="Inter, Arial, sans-serif" font-size="19">A cast of tiny sidekicks with their own roles.</text>
    <g transform="translate(350 233)">
      <g color="#b7a5ff" transform="translate(-145 -15) scale(.68)"><use href="#helper-square"/></g>
      <g color="#8bd9c2" transform="translate(-91 5) scale(.82)"><use href="#helper-round"/></g>
      <g color="#83b9ff" transform="translate(-29 -3) scale(.94)"><use href="#helper-tall"/></g>
      <g color="#f4775d" transform="translate(42 0) scale(1.03)"><use href="#helper"/></g>
      <g color="#ffbd67" transform="translate(112 6) scale(.83)"><use href="#helper-square"/></g>
      <g color="#b7a5ff" transform="translate(164 -12) scale(.62)"><use href="#helper-round"/></g>
      <path d="M-178 43c86 26 240 28 354-1" fill="none" stroke="#676975" stroke-width="2" stroke-dasharray="4 7"/>
    </g>
    <text x="350" y="369" text-anchor="middle" fill="#f5f1ed" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-2">ari</text>
  </g>

  <text x="800" y="1140" text-anchor="middle" fill="#a5a7b1" font-family="Inter, Arial, sans-serif" font-size="16">Choose a number—or tell me what to mix from two.</text>
</svg>

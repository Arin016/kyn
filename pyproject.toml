[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name is ari-crew: plain "ari" is taken on PyPI (Asterisk REST
# library). The import package stays "kyn" and the console scripts stay
# "ari" and "kyn", so `uvx ari-crew serve` just works after install.
name = "ari-crew"
version = "0.1.0"
description = "Ari — a shared workspace for Kiro, OpenCode, and Codex agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arin Mallanna" }]
keywords = ["agents", "acp", "kiro", "opencode", "codex", "control-room"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=14,<16",
]

[project.urls]
Homepage = "https://github.com/Arin016/kyn"
Repository = "https://github.com/Arin016/kyn"

[project.optional-dependencies]
# Alias of the core dependencies so source-checkout commands like
# `uv sync --extra server` keep working.
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=14,<16",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[project.scripts]
ari = "kyn.cli:main"
kyn = "kyn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kyn"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "kyn/web"

[tool.hatch.build.targets.sdist]
packages = ["src/kyn"]

[tool.hatch.build.targets.sdist.force-include]
"web" = "kyn/web"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiro-bot"
version = "0.1.0"
description = "A persistent local bot and orchestration layer for AWS Kiro over ACP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arin Mallanna" }]
dependencies = []

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=14,<16",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[project.scripts]
kiro-bot = "kiro_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kiro_bot"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "kiro_bot/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
